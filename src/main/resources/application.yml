spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/prueba
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/ddl/01_schema.sql
      data-locations:
        - classpath:sql/ddl/02_procedures.sql
        - classpath:sql/dml/03_sample_data.sql
      platform: postgresql
      separator: "@@"

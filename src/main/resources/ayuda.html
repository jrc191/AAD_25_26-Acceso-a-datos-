<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka.Info - Presentación</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // Componentes de Iconos (Sustituyen a lucide-react para funcionar en local sin bundler)
        const IconServer = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
        );
        const IconLayers = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
        );
        const IconSend = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        );
        const IconDownload = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const IconShare2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
        );
        const IconDatabase = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
        );
        const IconArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconActivity = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.48 12H2"/></svg>
        );

        // Componente Principal
        function KafkaPresentation() {
            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
                    {/* Contenedor Principal */}
                    <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200">
                        
                        {/* Cabecera */}
                        <header className="bg-slate-900 text-white p-6 md:p-10">
                            <div className="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl font-bold tracking-wider">KAFKA</span>
                                </div>
                                <div className="hidden md:flex gap-6 text-sm font-medium text-slate-300">
                                    <span href="#introduccion">1. Introducción</span>
                                    <span href="#arquitectura-core">2. Arquitectura</span>
                                    <span href="#actores">3. Actores</span>
                                    <span href="#flujo-mensajes">4. Flujo</span>
                                </div>
                            </div>
                            
                            <h1 className="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">
                                Apache Kafka: <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                                    El Ecosistema de Mensajería
                                </span>
                            </h1>
                            <p className="text-lg text-slate-300 max-w-3xl">
                                Conceptos fundamentales para el procesamiento de flujos de eventos. 
                            </p>
                        </header>

                        {/* Contenido */}
                        <div className="p-6 md:p-10 space-y-12">

                            {/* 1. Introducción */}
                            <section id="introduccion">
                                <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b-2 border-blue-100 pb-2">
                                    <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-sm">1</span>
                                    ¿Qué es Apache Kafka?
                                </h2>
                                <div className="bg-slate-50 p-6 rounded-lg border border-slate-200 flex gap-6 items-start">
                                    <div className="bg-white p-4 rounded-full shadow-sm">
                                        <IconActivity className="w-8 h-8 text-blue-600" />
                                    </div>
                                    <div>
                                        <p className="text-slate-700 text-lg leading-relaxed">
                                            Es una <strong>plataforma distribuida de transmisión de eventos</strong> (event streaming). 
                                            Permite leer, escribir, almacenar y procesar flujos de datos en tiempo real de forma escalable, 
                                            tolerante a fallos y extremadamente rápida. Es el "sistema nervioso" central que conecta 
                                            diferentes aplicaciones.
                                        </p>
                                    </div>
                                </div>
                            </section>

                            {/* 2. Arquitectura Core */}
                            <section id="arquitectura-core">
                                <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b-2 border-teal-100 pb-2">
                                    <span className="bg-teal-100 text-teal-700 px-3 py-1 rounded-lg text-sm">2</span>
                                    Infraestructura Core
                                </h2>
                                <div className="grid md:grid-cols-2 gap-6">
                                    
                                    {/* Broker */}
                                    <div className="bg-white border-2 border-slate-100 p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-10">
                                            <IconServer className="w-24 h-24" />
                                        </div>
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="p-2 bg-slate-800 text-white rounded-lg">
                                                <IconServer className="w-6 h-6" />
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800">Broker</h3>
                                        </div>
                                        <p className="text-slate-600">
                                            Es el <strong>servidor central</strong> de Kafka. Su función es recibir los mensajes, almacenarlos de forma persistente en disco y servirlos cuando se solicitan. Un clúster de Kafka está formado por múltiples Brokers trabajando juntos.
                                        </p>
                                    </div>

                                    {/* Topic */}
                                    <div className="bg-white border-2 border-slate-100 p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-10">
                                            <IconLayers className="w-24 h-24" />
                                        </div>
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="p-2 bg-teal-600 text-white rounded-lg">
                                                <IconLayers className="w-6 h-6" />
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800">Topic</h3>
                                        </div>
                                        <p className="text-slate-600">
                                            Es la <strong>categoría o canal</strong> donde se organizan los datos (ej. <code>str-topic</code>). Funciona como un registro (log) donde los mensajes se añaden secuencialmente. Los Topics se dividen en <em>particiones</em> para distribuir la carga.
                                        </p>
                                    </div>

                                </div>
                            </section>

                            {/* 3. Actores */}
                            <section id="actores">
                                <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b-2 border-indigo-100 pb-2">
                                    <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm">3</span>
                                    Los Actores del Sistema
                                </h2>
                                <div className="grid md:grid-cols-2 gap-6">
                                    
                                    {/* Producer */}
                                    <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-xl">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="p-2 bg-indigo-600 text-white rounded-full">
                                                <IconSend className="w-5 h-5" />
                                            </div>
                                            <h3 className="text-xl font-bold text-indigo-900">Producer (Productor)</h3>
                                        </div>
                                        <p className="text-indigo-800/80 mb-4">
                                            La aplicación origen. Es el responsable de <strong>crear y enviar (publicar)</strong> los datos a Kafka.
                                        </p>
                                        <ul className="text-sm text-indigo-700 space-y-2 list-disc ml-5">
                                            <li>Decide a qué Topic enviar la información.</li>
                                            <li>No espera a que el mensaje sea consumido.</li>
                                            <li>Ejemplo en práctica: Petición REST desde Postman.</li>
                                        </ul>
                                    </div>

                                    {/* Consumer */}
                                    <div className="bg-pink-50 border border-pink-100 p-6 rounded-xl">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="p-2 bg-pink-600 text-white rounded-full">
                                                <IconDownload className="w-5 h-5" />
                                            </div>
                                            <h3 className="text-xl font-bold text-pink-900">Consumer (Consumidor)</h3>
                                        </div>
                                        <p className="text-pink-800/80 mb-4">
                                            La aplicación destino. Es el responsable de <strong>leer y procesar</strong> los datos de Kafka.
                                        </p>
                                        <ul className="text-sm text-pink-700 space-y-2 list-disc ml-5">
                                            <li>Se "suscribe" a uno o varios Topics.</li>
                                            <li>Lleva el control de qué mensajes ha leído (Offset).</li>
                                            <li>Ejemplo en práctica: Guardar el mensaje en PostgreSQL.</li>
                                        </ul>
                                    </div>

                                </div>
                            </section>

                            {/* 4. Flujo de Mensajes */}
                            <section id="flujo-mensajes">
                                <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3 border-b-2 border-slate-200 pb-2">
                                    <span className="bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-sm">4</span>
                                    Flujo de Mensajes (Demostración Práctica)
                                </h2>
                                
                                <div className="bg-slate-900 rounded-xl p-8 text-white shadow-inner flex flex-col md:flex-row items-center justify-between gap-6">
                                    
                                    {/* Paso 1 */}
                                    <div className="flex flex-col items-center text-center space-y-3 w-full md:w-1/3 relative">
                                        <div className="bg-indigo-600 p-4 rounded-full shadow-lg z-10 border-4 border-slate-900">
                                            <IconSend className="w-8 h-8" />
                                        </div>
                                        <h4 className="font-bold text-indigo-300">1. Produce</h4>
                                        <p className="text-xs text-slate-400">Postman envía HTTP POST. <br/>El Producer serializa el String.</p>
                                    </div>

                                    <IconArrowRight className="w-12 h-12 text-slate-600 hidden md:block" />
                                    <IconArrowRight className="w-8 h-8 text-slate-600 md:hidden rotate-90" />

                                    {/* Paso 2 */}
                                    <div className="flex flex-col items-center text-center space-y-3 w-full md:w-1/3 relative">
                                        <div className="bg-teal-500 p-4 rounded-xl shadow-lg z-10 border-4 border-slate-900">
                                            <IconLayers className="w-8 h-8 text-slate-900" />
                                        </div>
                                        <h4 className="font-bold text-teal-300">2. Almacena</h4>
                                        <p className="text-xs text-slate-400">El Broker guarda el mensaje en<br/><code>str-topic</code> (Partición 0 o 1).</p>
                                    </div>

                                    <IconArrowRight className="w-12 h-12 text-slate-600 hidden md:block" />
                                    <IconArrowRight className="w-8 h-8 text-slate-600 md:hidden rotate-90" />

                                    {/* Paso 3 */}
                                    <div className="flex flex-col items-center text-center space-y-3 w-full md:w-1/3 relative">
                                        <div className="flex gap-2">
                                            <div className="bg-pink-600 p-4 rounded-full shadow-lg z-10 border-4 border-slate-900">
                                                <IconDownload className="w-8 h-8" />
                                            </div>
                                            <div className="bg-blue-600 p-4 rounded-full shadow-lg z-10 border-4 border-slate-900 -ml-4">
                                                <IconDatabase className="w-8 h-8" />
                                            </div>
                                        </div>
                                        <h4 className="font-bold text-pink-300">3. Consume & Persiste</h4>
                                        <p className="text-xs text-slate-400">El Consumer detecta el mensaje <br/> y JPA lo guarda en PostgreSQL.</p>
                                    </div>

                                </div>
                            </section>

                        </div>
                        
                        {/* Footer */}
                        <footer className="bg-slate-100 p-6 text-center text-sm text-slate-500 border-t border-slate-200">
                            Apache Kafka y Persistencia JPA @JRC191
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KafkaPresentation />);
    </script>
</body>
</html>
